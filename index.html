<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Library Smart Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <style>
        body { background-color: #e5ddd5; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .chat-bg { flex: 1; overflow-y: auto; padding: 15px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 12px; border-radius: 0 15px 15px 15px; max-width: 90%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid #ddd; line-height: 1.5; color: #111; }
        .user-msg { background: #dcf8c6; align-self: flex-end; border-radius: 15px 15px 0 15px; border: none; }
        .highlight { background: #ffeb3b; font-weight: bold; padding: 0 2px; }
    </style>
</head>
<body>
    <nav class="bg-[#075e54] text-white p-4 flex justify-between items-center shadow-lg shrink-0">
        <div class="flex items-center gap-3">
            <i class="fas fa-university text-xl"></i>
            <div>
                <h1 class="font-bold text-sm leading-none">Library Digital Hub</h1>
                <span id="st" class="text-[10px] text-green-300 font-bold uppercase tracking-widest">● Loading...</span>
            </div>
        </div>
        <button onclick="sync()" class="bg-white/10 p-2 rounded-lg text-[10px] border border-white/20 uppercase font-bold">Sync</button>
    </nav>

    <div id="chat" class="chat-bg">
        <div class="msg"><b>Namaste! 🙏</b><br>Main active hoon. Aap kuch bhi search karein (Staff, Rules, timing, E-Resource).</div>
    </div>

    <div class="bg-[#f0f0f0] p-3 flex items-center gap-2 border-t shrink-0">
        <input type="text" id="ui" onkeypress="if(event.key==='Enter') search()" 
            class="flex-1 p-3.5 rounded-full outline-none text-sm bg-white shadow-sm" placeholder="Type here...">
        <button onclick="search()" class="bg-[#128c7e] text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md active:scale-90 transition">
            <i class="fas fa-search"></i>
        </button>
    </div>

    <script>
        const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQRprdfyXeedNnWWOmaYUmp_MvuRTLA6K-yoHeTu8cSI8oh4B_1UtO_cvPiwVoMSD0BOcmf7kkrx517/pub?output=csv";
        let DB = [];

        // Advanced CSV Parser to handle commas inside quotes
        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentField.trim());
                    currentField = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (currentField || currentRow.length > 0) {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = '';
                    }
                } else {
                    currentField += char;
                }
            }
            if (currentField || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                rows.push(currentRow);
            }
            if (rows.length < 2) return [];
            const headers = rows[0].map(h => h.replace(/"/g, '').trim());
            return rows.slice(1).map(r => {
                let obj = {};
                headers.forEach((h, i) => obj[h] = (r[i] || "").replace(/"/g, ''));
                return obj;
            });
        }

        async function sync() {
            const st = document.getElementById('st');
            try {
                const res = await fetch(URL + "&t=" + Date.now());
                const raw = await res.text();
                DB = parseCSV(raw);
                st.innerText = "● ONLINE (" + DB.length + " RECORDS)";
                st.style.color = "#4ade80";
            } catch (e) { st.innerText = "● OFFLINE"; }
        }

        function search() {
            const ui = document.getElementById('ui');
            let q = ui.value.trim().toLowerCase();
            if(!q) return;

            addMsg(ui.value, true);
            ui.value = "";

            // Smart Multi-word search
            const results = DB.filter(item => {
                const itemValues = Object.values(item).join(' ').toLowerCase();
                return itemValues.includes(q);
            });

            setTimeout(() => {
                if (results.length > 0) {
                    let m = `Found ${results.length} result(s):<br>`;
                    results.slice(0, 10).forEach(it => {
                        m += `<div style="background:#f9f9f9; padding:12px; border-radius:10px; border-left:4px solid #075e54; margin-top:10px; font-size:13px; color:black">`;
                        for(let [k, v] of Object.entries(it)) {
                            if(v && v !== "-") {
                                if(String(v).startsWith('http')) {
                                    m += `<a href="${v}" target="_blank" style="display:block; background:#2563eb; color:white; text-align:center; padding:8px; border-radius:8px; margin-top:10px; font-weight:bold; text-decoration:none; font-size:11px;">OPEN LINK</a>`;
                                } else {
                                    m += `<b>${k}:</b> ${v}<br>`;
                                }
                            }
                        }
                        m += `</div>`;
                    });
                    addMsg(m, false);
                } else {
                    addMsg(`Maaf kijiye, "<b>${q}</b>" se juda kuch nahi mila. Try: Staff, Science, Law...`, false);
                }
            }, 300);
        }

        function addMsg(t, u) {
            const b = document.getElementById('chat');
            const d = document.createElement('div');
            d.className = `flex ${u ? 'justify-end' : 'justify-start'}`;
            d.innerHTML = `<div class="msg ${u ? 'user-msg' : ''}">${t}</div>`;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }
        window.onload = sync;
    </script>
</body>
</html>
