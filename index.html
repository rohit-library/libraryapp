<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Library Smart App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/all.min.css">
    <style>
        body { background-color: #e5ddd5; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; display: flex; flex-direction: column; gap: 12px; }
        .msg-bot { background: white; padding: 12px; border-radius: 0 15px 15px 15px; max-width: 90%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid #ddd; line-height: 1.5; color: #111; }
        .msg-user { background: #dcf8c6; padding: 10px 15px; border-radius: 15px 15px 0 15px; max-width: 80%; align-self: flex-end; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 14px; }
        .result-card { background: #f9f9f9; padding: 10px; border-radius: 10px; border-left: 4px solid #075e54; margin-top: 10px; font-size: 13px; }
        .highlight { background: #fff176; font-weight: bold; }
    </style>
</head>
<body>

    <!-- App Header -->
    <nav class="bg-[#075e54] text-white p-4 flex justify-between items-center shadow-lg shrink-0">
        <div class="flex items-center gap-3">
            <i class="fas fa-university text-xl text-green-300"></i>
            <div>
                <h1 class="font-bold text-sm leading-none">Library Smart Assistant</h1>
                <span id="st" class="text-[10px] text-green-200 opacity-80 uppercase font-bold tracking-widest">Connecting...</span>
            </div>
        </div>
        <button onclick="sync()" class="bg-white/10 p-2 rounded-full active:rotate-180 transition-all duration-500">
            <i class="fas fa-sync-alt text-xs"></i>
        </button>
    </nav>

    <!-- Chat Interface -->
    <div id="chatBox" class="chat-area">
        <div class="msg-bot">
            <b>Namaste! 🙏</b><br>
            Aap mujhse kuch bhi pooch sakte hain. <br>
            <i>Example: "Library assistant", "Rohit", "E-resource", "Law"</i>
        </div>
    </div>

    <!-- Search Input Bar -->
    <div class="bg-[#f0f0f0] p-3 flex items-center gap-2 border-t shrink-0">
        <div class="flex-1 bg-white rounded-full px-4 flex items-center shadow-sm">
            <input type="text" id="ui" onkeypress="if(event.key==='Enter') search()" 
                class="w-full py-2.5 outline-none text-sm bg-transparent" placeholder="Yahan likhein...">
        </div>
        <button onclick="search()" class="bg-[#128c7e] text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition">
            <i class="fas fa-search"></i>
        </button>
    </div>

    <script>
        const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmpratIfSu-AhTJMuV1bb4ZqOadBTAkYPa6KWCURxyyz5lbi1c6HC2FcdoUz4M960ajQUp4lc3-eSz/pub?output=csv";
        let DB = [];

        // Robust CSV Parser (Quotes, Commas handling)
        function parseCSV(text) {
            const rows = [];
            let currentField = '', inQuotes = false, currentRow = [];
            for (let char of text) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { currentRow.push(currentField.trim()); currentField = ''; }
                else if (char === '\n' && !inQuotes) { currentRow.push(currentField.trim()); rows.push(currentRow); currentRow = []; currentField = ''; }
                else currentField += char;
            }
            if (currentRow.length > 0) { currentRow.push(currentField.trim()); rows.push(currentRow); }
            const headers = rows[0].map(h => h.replace(/"/g, '').trim());
            return rows.slice(1).map(r => {
                let obj = {};
                headers.forEach((h, i) => obj[h] = (r[i] || "").replace(/"/g, ''));
                return obj;
            });
        }

        async function sync() {
            const st = document.getElementById('st');
            try {
                const res = await fetch(URL + "&cb=" + Date.now());
                const raw = await res.text();
                DB = parseCSV(raw);
                st.innerText = "● ONLINE (" + DB.length + " RECORDS)";
                st.style.color = "#4ade80";
            } catch (e) { st.innerText = "● OFFLINE"; }
        }

        function search() {
            const ui = document.getElementById('ui');
            let q = ui.value.trim().toLowerCase();
            if(!q) return;

            addMsg(ui.value, true);
            ui.value = "";

            // Smart Search: Checks if the query words exist in the row
            const searchTerms = q.split(" ").filter(word => word.length > 1);
            
            const results = DB.filter(item => {
                const itemString = Object.values(item).join(" ").toLowerCase();
                // Check if all or any of the typed words are present
                return searchTerms.every(term => itemString.includes(wordCleaner(term)));
            });

            setTimeout(() => {
                if (results.length > 0) {
                    let m = `<b>Mujhe ye ${results.length} results mile hain:</b><br>`;
                    results.slice(0, 15).forEach(it => {
                        m += `<div class="result-card">`;
                        for(let [k, v] of Object.entries(it)) {
                            if(v && v !== "-" && v !== " ") {
                                if(v.startsWith('http')) m += `<a href="${v}" target="_blank" style="display:block; background:#2563eb; color:white; text-align:center; padding:8px; border-radius:8px; margin-top:10px; font-weight:bold; text-decoration:none; font-size:11px;">MUKHYA LINK / OPEN</a>`;
                                else m += `<div><b>${k}:</b> ${v}</div>`;
                            }
                        }
                        m += `</div>`;
                    });
                    addMsg(m, false);
                } else {
                    addMsg(`Maaf kijiye, mujhe "<b>${q}</b>" se juda kuch nahi mila. Try karein sirf naam ya department likhna.`, false);
                }
            }, 300);
        }

        function wordCleaner(w) { return w.replace(/[^a-zA-Z0-9]/g, ''); }

        function addMsg(t, u) {
            const b = document.getElementById('chatBox');
            const d = document.createElement('div');
            d.className = u ? 'msg-user' : 'msg-bot';
            d.innerHTML = t;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }

        window.onload = sync;
    </script>
</body>
</html>
